directory_tree: &directory_tree
  point_cloud_dirname: velodyne

  lidar_scene_info: lidar_scene_info
  instance_mask: instance_mask
  road_split_label: road_split_label
  road_split_log: road_split_log
  semantic_label_3d: labels
  label_2: label_2

  dataset_type: "SemanticKITTI"
  dataset_output_type: "SemanticKITTI"

  depth_format: "real_distance"

generated_dataset:
  name: semantic_kitti_generated
  root_dir: "_outputs/semanticKITTI"
  split: "sequences/08"
  output_dir: "_outputs/semanticKITTI_test/sequences/08"
  <<: *directory_tree


source_dataset:
  name: semantic_kitti_source
  root_dir: "_data/semanticKITTI/dataset"
  split: "sequences/08"
  <<: *directory_tree
  occlusion_th: 0.95
  obj_insert_config_path: "configs/obj_insert_config.yml"
