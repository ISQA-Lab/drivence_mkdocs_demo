# Object insertion configuration
# Defines the groups of 3D assets to be inserted into a scene.
# Detailed member properties (relative displacement, semantic label, etc.) are stored in obj_insert_config.json.

groups:
# Single-object groups
    - group_name: "car_1"

# Composite groups
#    - group_name: "traffic_sign_1"
#    - group_name: "person-riding-bicycle_1"
#    - group_name: "person-riding-motor_1"
#    - group_name: "tree_1"
#    - group_name: "dog-walker_1"
#    - group_name: "person-pushing-bicycle_1"
#    - group_name: "person-pulling-luggage_1"


# Object attribute mapping file
config_file: "obj_insert_config.json"

